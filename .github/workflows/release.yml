name: Build and release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            binary: music-syncer
            archive: music-syncer-linux-x86_64.tar.gz
          - name: macos-arm64
            os: macos-latest
            binary: music-syncer
            archive: music-syncer-macos-arm64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            binary: music-syncer.exe
            archive: music-syncer-windows-x86_64.zip
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build
        run: cargo build --release --locked
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir -p dist
          cp "target/release/$BINARY" "dist/$BINARY"
          tar -C dist -czf "dist/$ARCHIVE" "$BINARY"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/$env:BINARY" "dist/$env:BINARY"
          Compress-Archive `
            -Path "dist/$env:BINARY" `
            -DestinationPath "dist/$env:ARCHIVE"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            dist/*.tar.gz \
            dist/*.zip \
            --title "Build $VERSION" \
            --generate-notes
