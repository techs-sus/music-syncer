[package]
name    = "music-player"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rustypipe = { git = "https://codeberg.org/ThetaDev/rustypipe.git", branch = "feat/deobf-extractor", features = [
	"rustls",
] }
lofty = "0.25.0"
mime2ext = "0.1.54"
pathdiff = "0.2.3"
reqwest = { version = "0.13.4", features = ["rustls"] }
thiserror = "2.0.20"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "sqlite"] }
tokio = { version = "1.53.1", default-features = false, features = [
	"rt",
	"rt-multi-thread",
	"macros",
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
futures = "0.3.33"
